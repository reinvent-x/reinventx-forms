name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint, static analysis, unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHPCS
        run: composer lint

      - name: PHPStan
        run: composer stan

      - name: Unit tests
        run: composer test:unit

  js:
    name: JS — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:js

      - name: Build
        run: pnpm run build

      - name: Ensure both bundles were produced
        run: test -f build/admin.js && test -f build/admin.asset.php && test -f build/public-form.js

      # Guardrails from MILESTONES M1.5: the design system is bundled, so keep
      # the admin bundle honest, and the public bundle must stay framework-free.
      - name: Enforce bundle size budgets
        run: |
          admin_js=$(wc -c < build/admin.js)
          admin_css=$(wc -c < build/admin.css)
          public_js=$(wc -c < build/public-form.js)
          echo "admin.js=${admin_js}B admin.css=${admin_css}B public-form.js=${public_js}B"
          test "$admin_js" -le 179200 || { echo "admin.js exceeds 175 KB"; exit 1; }
          test "$admin_css" -le 51200 || { echo "admin.css exceeds 50 KB"; exit 1; }
          test "$public_js" -le 5120 || { echo "public-form.js exceeds 5 KB"; exit 1; }

  integration:
    name: Integration — WordPress test suite (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Start wp-env
        run: pnpm exec wp-env start

      - name: Run integration tests
        run: pnpm run test:php

  plugin-check:
    name: Plugin Check — wp.org readiness of the release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Assemble the same artifact release.yml publishes, then check that
      # rather than the working tree. Checking the tree would flag dev-only
      # files that .distignore already keeps out of the ZIP, so the exclusion
      # list would have to be maintained twice and could drift from reality.
      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Build assets
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble the ZIP
        run: bin/build-zip.sh

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./dist/reinventx-forms

version: 2

updates:
  # Dev-only in practice: the shipped ZIP contains no third-party PHP beyond
  # the Composer autoloader, so these updates affect CI and tooling only.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The admin bundle ships compiled, so npm updates DO reach users — these
  # PRs must pass the bundle-size budgets in ci.yml before merging.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wordpress:
        patterns:
          - '@wordpress/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
